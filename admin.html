<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tree Log Admin</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
    font-size:36px;
    font-weight:bold;
}

.card{
    width:90%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:18px;
    border:1px solid #999;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.secondary{
    background:#1976d2;
}

.secondary:hover{
    background:#0d47a1;
}

#status{
    margin-top:20px;
    font-size:18px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<header>
🌳 Tree Log Admin
</header>

<div class="card">

<h2>Add New Tree</h2>

<input id="treeID" placeholder="Tree ID (TR001)">
<input id="commonName" placeholder="Common Name">
<input id="scientificName" placeholder="Scientific Name">
<input id="age" placeholder="Age">
<input id="location" placeholder="Location">

<button id="saveBtn">
💾 Save Tree
</button>

<p id="status"></p>

<hr>

<button class="secondary" onclick="location.href='index.html'">
🏠 Back to Tree Log
</button>

<button class="secondary" onclick="location.href='tree.html?id=TR001'">
🌳 Test Tree Page
</button>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>

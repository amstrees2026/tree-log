<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tree Details</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.card{
    background:white;
    width:90%;
    max-width:700px;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

img{
    width:100%;
    max-width:400px;
    border-radius:12px;
    margin:20px auto;
    display:block;
}

p{
    font-size:18px;
    margin:10px 0;
}

button{
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#1b5e20;
}

#qrcode{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<header>
🌳 Tree Details
</header>

<div class="card" id="treeData">

Loading tree...

</div>

<br>

<button onclick="window.location='index.html'">
⬅ Back
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyD2XTkILn4iMgR_LE6sDlqI_08NaTV5ebo",

authDomain:"tree-log-42cf3.firebaseapp.com",

projectId:"tree-log-42cf3",

storageBucket:"tree-log-42cf3.firebasestorage.app",

messagingSenderId:"580957773231",

appId:"1:580957773231:web:d9a8301c3a869e157fa35a"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const params=new URLSearchParams(window.location.search);

const id=params.get("id");

async function loadTree(){

if(!id){

document.getElementById("treeData").innerHTML="❌ No Tree ID Provided";

return;

}

const ref=doc(db,"trees",id);

const snap=await getDoc(ref);

if(!snap.exists()){

document.getElementById("treeData").innerHTML="❌ Tree Not Found";

return;

}

const tree=snap.data();

document.getElementById("treeData").innerHTML=`

<h2>${id}</h2>

<img
src="images/${id}.jpg"
onerror="this.src='images/default.jpg'">

<p><b>Common Name:</b> ${tree["Common Name"]||"N/A"}</p>

<p><b>Scientific Name:</b> ${tree["Scientific Name"]||"N/A"}</p>

<p><b>Age:</b> ${tree["Age"]||"N/A"}</p>

<p><b>Location:</b> ${tree["Location"]||"N/A"}</p>

<h3>QR Code</h3>

<div id="qrcode"></div>

`;

new QRCode(document.getElementById("qrcode"),{

text:window.location.href,

width:180,

height:180

});

}

loadTree();

</script>

</body>
</html>

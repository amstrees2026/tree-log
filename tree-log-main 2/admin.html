<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tree Log Admin</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.card{
    width:90%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    color:#2e7d32;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:17px;
    border:1px solid #999;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

#status{
    margin-top:20px;
    font-weight:bold;
    text-align:center;
}

.back{
    background:#555;
}

.back:hover{
    background:#333;
}

</style>

</head>

<body>

<header>

🌳 Tree Log Admin

</header>

<div class="card">

<h2>Add / Update Tree</h2>

<input id="treeID" placeholder="Tree ID (TR001)">

<input id="commonName" placeholder="Common Name">

<input id="scientificName" placeholder="Scientific Name">

<input id="age" placeholder="Age">

<input id="location" placeholder="Location">

<button id="saveBtn">

💾 Save Tree

</button>

<a href="index.html">

<button type="button" class="back">

⬅ Return to Website

</button>

</a>

<p id="status"></p>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>

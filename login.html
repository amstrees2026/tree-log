<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔐 Tree Log Admin Login</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    text-align:center;
}

h1{
    color:#2e7d32;
    margin-bottom:10px;
}

p{
    color:#555;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #999;
    border-radius:8px;
    font-size:17px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.back{
    background:#1565c0;
}

.back:hover{
    background:#0d47a1;
}

#status{
    margin-top:20px;
    font-weight:bold;
}

footer{
    position:fixed;
    bottom:15px;
    left:15px;
    font-size:13px;
    color:#555;
    line-height:1.5;
}

footer strong{
    color:#2e7d32;
}

footer a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

footer a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="card">

<h1>🔐 Tree Log Admin</h1>

<p>Sign in to manage the Tree Log database.</p>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<br><br>

<a href="index.html">

<button
type="button"
class="back">

⬅ Back to Tree Log

</button>

</a>

<p id="status"></p>

</div>

<footer>

<strong>Developed by Eshaan and Aksharan</strong><br>

MAIS 2026<br>

Developed for

<a href="https://skylightworld.org/" target="_blank">

Skylight World

</a>

</footer>

<script type="module" src="login.js"></script>

</body>

</html>

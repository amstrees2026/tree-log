<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌳 Tree Log</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
    font-size:34px;
    font-weight:bold;
}

.card{
    background:white;
    width:90%;
    max-width:600px;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    color:#2e7d32;
}

p{
    font-size:18px;
}

input{
    width:85%;
    padding:12px;
    font-size:18px;
    border:1px solid #999;
    border-radius:8px;
    margin-top:10px;
}

button{
    margin-top:20px;
    padding:12px 30px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.adminButton{
    background:#1565c0;
}

.adminButton:hover{
    background:#0d47a1;
}

footer{
    margin-top:50px;
    padding:20px;
    font-size:14px;
    color:#555;
}

footer a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

footer a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<header>

🌳 Tree Log

</header>

<div class="card">

<h2>Welcome!</h2>

<p>
Enter a Tree ID or scan a QR Code.
</p>

<input
id="treeID"
placeholder="Example: TR001">

<br>

<button onclick="openTree()">
Open Tree
</button>

<br><br>

<a href="login.html">

<button
class="adminButton"
type="button">

🔐 Tree Log Admin

</button>

</a>

</div>

<footer>

<strong>Developed by Eshaan and Aksharan</strong><br>

MAIS 2026<br><br>

Developed for

<a
href="https://skylightworld.org/"
target="_blank">

Skylight World

</a>

</footer>

<script>

function openTree(){

    let id=document
    .getElementById("treeID")
    .value
    .trim()
    .toUpperCase();

    if(id==""){

        alert("Please enter a Tree ID 🌱");

        return;

    }

    window.location.href="tree.html?id="+id;

}

document
.getElementById("treeID")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){

openTree();

}

});

</script>

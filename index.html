<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Log</title>

    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#e8f5e9;
            text-align:center;
        }

        header{
            background:#2e7d32;
            color:white;
            padding:20px;
            font-size:32px;
            font-weight:bold;
        }

        .card{
            background:white;
            width:90%;
            max-width:600px;
            margin:40px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        input{
            width:80%;
            padding:12px;
            font-size:18px;
            border-radius:8px;
            border:1px solid #999;
        }

        button{
            margin-top:20px;
            background:#2e7d32;
            color:white;
            border:none;
            padding:12px 30px;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1b5e20;
        }
    </style>
</head>
<body>

<header>
🌳 Tree Log
</header>

<div class="card">

<h2>Welcome!</h2>

<p>
Enter a Tree ID or scan a QR Code.
</p>

<input id="treeID" placeholder="Example: TR001">

<br>

<button onclick="openTree()">
Open Tree
</button>

</div>

<script>
function openTree(){

let id=document.getElementById("treeID").value;

window.location="tree.html?id="+id;

}
</script>

</body>
</html>

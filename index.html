<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Log</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e8f5e9;
    text-align:center;
}

header{
    background:#2e7d32;
    color:white;
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

.card{
    background:white;
    width:90%;
    max-width:600px;
    margin:40px auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input{
    width:80%;
    padding:12px;
    font-size:18px;
    border-radius:8px;
    border:1px solid #999;
}

button{
    margin-top:20px;
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.footer{
    width:100%;
    margin-top:40px;
    padding:20px;
    background:#f4f4f4;
    color:#555;
    font-size:14px;
    text-align:left;
    box-sizing:border-box;
}

.footer a{
    color:#2e7d32;
    text-decoration:none;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<header>
🌳 Tree Log
</header>

<div class="card">

<h2>Welcome!</h2>

<p>Enter a Tree ID or scan a QR Code.</p>

<input
id="treeID"
placeholder="Example: TR001">

<br>

<button onclick="openTree()">
Open Tree
</button>

<br><br>

<a href="login.html">
<button type="button">
🔐 Tree Log Admin
</button>
</a>

</div>

<div class="footer">

<strong>Developed by Eshaan and Aksharan MAIS 2026</strong><br>
Developed for

Skylight World
</a>

</div>

<script>

function openTree(){

    let id = document.getElementById("treeID").value.trim().toUpperCase();

    if(id===""){
        alert("Please enter a Tree ID 🌱");
        return;
    }

    window.location.href = "tree.html?id=" + id;

}

</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Log</title>

    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#e8f5e9;
            text-align:center;
        }

        header{
            background:#2e7d32;
            color:white;
            padding:20px;
            font-size:32px;
            font-weight:bold;
        }

        .card{
            background:white;
            width:90%;
            max-width:600px;
            margin:40px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        input{
            width:80%;
            padding:12px;
            font-size:18px;
            border-radius:8px;
            border:1px solid #999;
        }

        button{
            margin-top:20px;
            background:#2e7d32;
            color:white;
            border:none;
            padding:12px 30px;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1b5e20;
        }
    </style>
</head>
<body>

<header>
🌳 Tree Log
</header>

<div class="card">

<h2>Welcome!</h2>

<p>Enter a Tree ID or scan a QR Code.</p>

<input id="treeID" placeholder="Example: TR001">

<br>

<button onclick="openTree()">Open Tree</button>

<br><br>

<!-- ✅ NEW BUTTON -->
<button onclick="addTree()">🌱 Plant New Tree</button>

</div>

<!-- ✅ NORMAL SCRIPT -->
<script>
function openTree(){
    let id = document.getElementById("treeID").value.trim();

    if(id === ""){
        alert("Please enter a Tree ID 🌱");
        return;
    }

    window.location = "tree.html?id=" + id;
}

// ✅ ADD TREE FUNCTION
async function addTree(){
    let id = document.getElementById("treeID").value.trim();

    if(id === ""){
        alert("Enter Tree ID first 🌱");
        return;
    }

    try{
        const docRef = await window.addDoc(window.collection(window.db, "trees"), {
            treeID: id,
            date: new Date().toISOString()
        });

        alert("🌳 Tree added successfully!");
    }
    catch(error){
        console.error(error);
        alert("Error adding tree ❌");
    }
}
</script>

<!-- ✅ FIREBASE MODULE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2XTkILn4iMgR_LE6sDlqI_08NaTV5ebo",
  authDomain: "tree-log-42cf3.firebaseapp.com",
  projectId: "tree-log-42cf3",
  storageBucket: "tree-log-42cf3.appspot.com",
  messagingSenderId: "580957773231",
  appId: "1:580957773231:web:d9a8301c3a869e157fa35a",
  measurementId: "G-BL7Z12QN0M"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ MAKE FIREBASE GLOBAL
window.db = db;
window.collection = collection;
window.addDoc = addDoc;

console.log("🔥 Firebase connected!");
document.body.insertAdjacentHTML(
  "beforeend",
  "<p style='color:green;'>✅ Firebase Connected</p>"
);
</script>

</body>
</html>
